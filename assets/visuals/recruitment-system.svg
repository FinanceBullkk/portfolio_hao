    <rect x="52" y="102" width="138" height="226" rx="10"/><rect x="210" y="126" width="138" height="202" rx="10"/>
    <rect x="368" y="86" width="138" height="242" rx="10"/><rect x="526" y="146" width="138" height="182" rx="10"/>
  </g>
