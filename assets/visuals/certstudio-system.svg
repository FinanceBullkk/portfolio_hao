    <text x="420" y="352" text-anchor="middle" font-weight="700">REVIEW</text><text x="582" y="352" text-anchor="middle">DISPATCH</text>
  </g>
  <text x="678" y="405" fill="#171715" font-family="Georgia, serif" font-size="30" font-style="italic" text-anchor="end">verify before send.</text>
