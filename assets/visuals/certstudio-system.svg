  <g fill="none" stroke="#171715" stroke-width="2">
    <rect x="56" y="112" width="126" height="178" rx="8"/><rect x="206" y="92" width="126" height="198" rx="8"/>
    <rect x="356" y="130" width="126" height="160" rx="8"/><rect x="506" y="104" width="150" height="186" rx="8"/>
  </g>
  <g stroke="#171715" stroke-width="2"><path d="M76 144H154M76 164H142M226 128H304M226 148H290M376 166H462M376 186H446M526 144H636M526 164H612"/></g>
